<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a99a8"/></marker></defs><style>
  .bg{fill:#ffffff}
  text{font-family:'Segoe UI',system-ui,sans-serif;fill:#12233b}
  .t{font-size:19px;font-weight:700;fill:#0f2740}
  .st{font-size:12.5px;fill:#5d7183}
  .n{font-size:12.5px;font-weight:600}
  .s{font-size:11px;fill:#5d7183}
  .lb{font-size:10.5px;fill:#5d7183;font-weight:600}
  .box{stroke-width:1.6;rx:7}
  .manual{fill:#fff3e0;stroke:#d79b00}
  .proc{fill:#e3f0fc;stroke:#5b8db8}
  .dec{fill:#fff8de;stroke:#cdb04e}
  .ext{fill:#ede4f6;stroke:#8a6fb0}
  .ok{fill:#e4f3e4;stroke:#73a877}
  .err{fill:#fde8e6;stroke:#c76055}
  .sub{fill:#e0f2f1;stroke:#4d9e97;stroke-dasharray:5 3}
  .note{fill:#f6f7f9;stroke:#c9d2da}
  .ln{stroke:#8a99a8;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .ln.d{stroke-dasharray:5 4;stroke:#b0bcc8}
</style><rect class="bg" width="100%" height="100%"/><text class="t" x="40" y="46">Proceso manual — revisión de inventario</text><text class="st" x="40" y="70">Como se hace hoy, sin automatización</text><rect class="box manual" x="40" y="110" width="230" height="58"/><text class="n" x="155" y="143" text-anchor="middle">Alguien recuerda revisar</text><path class="ln" d="M 155,168 L 155,206"/><rect class="box manual" x="40" y="206" width="230" height="58"/><text class="n" x="155" y="239" text-anchor="middle">Abre la hoja de cálculo</text><path class="ln" d="M 155,264 L 155,302"/><rect class="box manual" x="40" y="302" width="230" height="58"/><text class="n" x="155" y="327" text-anchor="middle">Compara fila por fila</text><text class="s" x="155" y="344" text-anchor="middle">stock contra mínimo</text><path class="ln" d="M 155,360 L 155,398"/><rect class="box dec" x="55" y="398" width="200" height="62"/><text class="n" x="155" y="433" text-anchor="middle">¿Bajo el mínimo?</text><path class="ln" d="M 255,429 L 330,429"/><text class="lb" x="292" y="423" text-anchor="middle">No</text><rect class="box manual" x="330" y="402" width="180" height="54"/><text class="n" x="420" y="433" text-anchor="middle">Siguiente producto</text><path class="ln" d="M 420,402 L 420,372 L 155,372 L 155,360"/><path class="ln" d="M 155,460 L 155,498"/><text class="lb" x="155" y="473" text-anchor="middle">Sí</text><rect class="box manual" x="40" y="498" width="230" height="54"/><text class="n" x="155" y="529" text-anchor="middle">Anota el producto</text><path class="ln" d="M 155,552 L 155,586"/><rect class="box manual" x="40" y="586" width="230" height="54"/><text class="n" x="155" y="617" text-anchor="middle">Busca al responsable</text><path class="ln" d="M 270,613 L 340,613"/><rect class="box manual" x="340" y="586" width="200" height="54"/><text class="n" x="440" y="617" text-anchor="middle">Redacta el correo</text><path class="ln" d="M 540,613 L 600,613"/><rect class="box ok" x="600" y="586" width="180" height="54"/><text class="n" x="690" y="617" text-anchor="middle">Envía la solicitud</text><rect class="box note" x="620" y="110" width="520" height="300"/><text class="n" x="880" y="264" text-anchor="middle"></text><text class="n" x="645" y="140">Dónde falla</text><text class="s" x="645" y="168">Disparo — depende de que alguien se acuerde.</text><text class="s" x="645" y="184">Comparación manual — con muchas filas se saltan productos.</text><text class="s" x="645" y="200">Datos sucios — SKU y nombres con espacios y mayúsculas</text><text class="s" x="645" y="216">   mezcladas, que rompen cualquier búsqueda.</text><text class="s" x="645" y="232">Enrutamiento — hay que buscar a mano quién responde</text><text class="s" x="645" y="248">   por cada bodega.</text><text class="s" x="645" y="264">Sin trazabilidad — no queda registro de qué se revisó</text><text class="s" x="645" y="280">   ni de cuándo.</text><text class="s" x="645" y="296">Excepciones — una bodega nueva no tiene procedimiento.</text><text class="s" x="645" y="312"></text><text class="s" x="645" y="328">Consecuencia: el faltante se detecta tarde y obliga a</text><text class="s" x="645" y="344">una compra de urgencia, más costosa.</text></svg>