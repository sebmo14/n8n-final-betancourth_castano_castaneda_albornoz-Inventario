<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Bodega</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#262d38; --ink:#e6edf3; --muted:#8b949e;
    --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --err:#f85149; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:24px 16px}
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:22px}
  h1{margin:0 0 4px;font-size:1.45rem;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.9rem}
  .grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .card h2{margin:0 0 14px;font-size:.78rem;text-transform:uppercase;
           letter-spacing:.09em;color:var(--muted);font-weight:700}
  label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 5px}
  input,select{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
    background:#0d1117;color:var(--ink);font:inherit}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{width:100%;margin-top:9px;padding:11px 13px;border-radius:7px;border:1px solid var(--line);
    background:#21262d;color:var(--ink);font:600 .88rem/1.25 inherit;cursor:pointer;text-align:left}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button small{display:block;font-weight:400;color:var(--muted);font-size:.75rem;margin-top:3px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary small{color:#cfe3ff}
  .log{font-family:var(--mono);font-size:.78rem;background:#0d1117;border:1px solid var(--line);
    border-radius:8px;padding:13px;max-height:560px;overflow:auto;white-space:pre-wrap;
    word-break:break-word;margin:0}
  .entry{border-left:3px solid var(--line);padding:2px 0 2px 11px;margin-bottom:16px}
  .entry.ok{border-color:var(--ok)} .entry.warn{border-color:var(--warn)} .entry.err{border-color:var(--err)}
  .badge{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:.72rem}
  .badge.ok{background:rgba(63,185,80,.16);color:var(--ok)}
  .badge.warn{background:rgba(210,153,34,.16);color:var(--warn)}
  .badge.err{background:rgba(248,81,73,.16);color:var(--err)}
  .dim{color:var(--muted)}
  .hint{font-size:.78rem;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  code{font-family:var(--mono);background:#0d1117;padding:1px 5px;border-radius:4px;font-size:.92em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Simulador de Bodega</h1>
    <p class="sub">Emisor de eventos para el webhook de inventario · Clase 07 · datos de práctica</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Configuración</h2>

      <label for="url">URL del webhook</label>
      <input id="url" value="http://localhost:5678/webhook-test/inventario-movimiento">

      <label for="token">Token (<code>x-api-key</code>)</label>
      <input id="token" type="password" value="" autocomplete="off"
             placeholder="el valor de su credencial Header Auth">

      <div class="row">
        <div>
          <label for="sku">SKU</label>
          <select id="sku"></select>
        </div>
        <div>
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" type="number" min="1" value="3">
        </div>
      </div>

      <label for="motivo">Motivo</label>
      <select id="motivo">
        <option>venta</option>
        <option>despacho a sucursal</option>
        <option>avería</option>
        <option>ajuste de inventario</option>
      </select>

      <h2 style="margin-top:24px">Pruebas</h2>

      <button class="primary" data-case="valido">
        Registrar salida
        <small>Entrada válida → descuenta stock y responde 200</small>
      </button>

      <button data-case="incompleto">
        Enviar sin cantidad
        <small>Entrada incompleta → rechazo controlado 400</small>
      </button>

      <button data-case="sintoken">
        Enviar sin token
        <small>Protección → 401/403 antes de ejecutar nada</small>
      </button>

      <button data-case="duplicado" id="btn-dup" disabled>
        Reenviar el último movimiento
        <small>Idempotencia → mismo id, no descuenta dos veces</small>
      </button>

      <button data-case="inexistente">
        Enviar un SKU que no existe
        <small>→ 404 sin tocar la base</small>
      </button>

      <p class="hint">
        El token se enmascara en el registro. Antes de capturar pantalla,
        comprueben que no quede visible.
      </p>
    </div>

    <div class="card">
      <h2>Registro de peticiones</h2>
      <pre class="log" id="log"><span class="dim">Sin peticiones todavía.</span></pre>
    </div>
  </div>
</div>

<script>
const PRODUCTOS = [
  ["ARZ 001","Arroz · Principal · 5 de 10"],
  ["LEC 002","Leche Entera · Norte · 15 de 10"],
  ["ACE 003","Aceite Vegetal · Sur · 3 de 8"],
  ["AZU 004","Azúcar Blanca · Principal · 7 de 12"],
  ["CAF 005","Café Molido · Norte · 20 de 10"],
  ["HAR 006","Harina de Trigo · Sur · 4 de 10"],
  ["GAL 007","Galletas · Oriente · 18 de 15"],
  ["PAS 008","Pasta · Norte · 6 de 10"],
  ["SAL 009","Sal · Sur · 10 de 10"],
  ["ATU 010","Atún en Lata · Principal · 2 de 8"],
  ["CHO 011","Chocolate · Norte · 9 de 10"],
  ["AVE 012","Avena · Sur · 14 de 10"]
];

const $ = id => document.getElementById(id);
const log = $("log");
let ultimoMovimiento = null;
let primero = true;

PRODUCTOS.forEach(([sku, desc]) => {
  const o = document.createElement("option");
  o.value = sku;
  o.textContent = sku + " — " + desc;
  $("sku").append(o);
});

const nuevoId = () =>
  "MOV-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" +
  Math.random().toString(36).slice(2,8).toUpperCase();

function enmascarar(t){
  if (!t) return "(sin token)";
  return t.length <= 4 ? "****" : t.slice(0,3) + "*".repeat(t.length-3);
}

function escapar(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escribir(clase, titulo, detalle){
  if (primero){ log.innerHTML = ""; primero = false; }
  const div = document.createElement("div");
  div.className = "entry " + clase;
  div.innerHTML = titulo + "\n" + detalle;
  log.prepend(div);
}

async function enviar(caso){
  const url    = $("url").value.trim();
  const token  = $("token").value;
  const sku    = $("sku").value;
  const motivo = $("motivo").value;
  const cant   = Number($("cantidad").value);

  let body = { movimiento_id: nuevoId(), sku, cantidad: cant, motivo };
  let headers = { "Content-Type": "application/json", "x-api-key": token };
  let etiqueta = "Entrada válida";

  if (caso === "incompleto"){
    delete body.cantidad;
    etiqueta = "Entrada incompleta (sin cantidad)";
  }
  if (caso === "sintoken"){
    delete headers["x-api-key"];
    etiqueta = "Sin token de autenticación";
  }
  if (caso === "inexistente"){
    body.sku = "XXX 999";
    etiqueta = "SKU inexistente";
  }
  if (caso === "duplicado"){
    if (!ultimoMovimiento) return;
    body = { ...ultimoMovimiento };
    etiqueta = "Reenvío del mismo movimiento_id";
  }

  const headersVisibles = { ...headers };
  if (headersVisibles["x-api-key"]) headersVisibles["x-api-key"] = enmascarar(token);

  const t0 = performance.now();
  let status = 0, texto = "", fallo = null;

  try {
    const r = await fetch(url, { method:"POST", headers, body: JSON.stringify(body) });
    status = r.status;
    texto = await r.text();
  } catch (e) {
    fallo = e.message;
  }

  const ms = Math.round(performance.now() - t0);

  if (fallo){
    escribir("err",
      '<span class="badge err">SIN RESPUESTA</span> <b>' + etiqueta + '</b>',
      '<span class="dim">POST ' + escapar(url) + '</span>\n' +
      'Error de red: ' + escapar(fallo) + '\n\n' +
      '<span class="dim">Si dice «Failed to fetch», casi siempre es CORS o n8n apagado.\n' +
      'Revisen: nodo Webhook → Options → Allowed Origins (CORS) = *\n' +
      'y que estén escuchando (Listen for test event) si usan la Test URL.</span>');
    return;
  }

  let cuerpo = texto;
  let json = null;
  try { json = JSON.parse(texto); cuerpo = JSON.stringify(json, null, 2); } catch(_) {}

  const clase = status >= 200 && status < 300 ? "ok" : (status >= 500 ? "err" : "warn");

  if (caso !== "duplicado" && status >= 200 && status < 300 && json && json.ok){
    ultimoMovimiento = body;
    $("btn-dup").disabled = false;
  }

  escribir(clase,
    '<span class="badge ' + clase + '">' + status + '</span> <b>' + etiqueta + '</b> ' +
    '<span class="dim">· ' + ms + ' ms</span>',
    '<span class="dim">POST ' + escapar(url) + '</span>\n' +
    '<span class="dim">headers:</span> ' + escapar(JSON.stringify(headersVisibles)) + '\n' +
    '<span class="dim">body:</span> ' + escapar(JSON.stringify(body)) + '\n\n' +
    '<span class="dim">respuesta:</span>\n' + escapar(cuerpo));
}

document.querySelectorAll("button[data-case]").forEach(b => {
  b.addEventListener("click", () => enviar(b.dataset.case));
});
</script>
</body>
</html>
